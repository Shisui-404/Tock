name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: CLI smoke test
        shell: bash
        run: |
          export TOCK_HOME="$RUNNER_TEMP/tock-smoke"
          python -m tock add +1m --label smoke
          python -m tock list
          python -m tock doctor
          python -m tock start
          python -m tock status
          python -m tock stop
